query ReviewState($owner: String!, $name: String!, $number: Int!, $threads: String, $files: String) {
  viewer { login }
  repository(owner: $owner, name: $name) {
    pullRequest(number: $number) {
      id
      author { login }
      bodyHTML
      createdAt
      includesCreatedEdit
      userContentEdits(first: 20) {
        totalCount
        nodes { editedAt deletedAt editor { login } diff }
      }
      reactionGroups { ...reactions }
      reviews(states: PENDING, first: 1) {
        nodes { id commit { oid } comments { totalCount } }
      }
      submitted: reviews(last: 50, states: [APPROVED, CHANGES_REQUESTED, COMMENTED, DISMISSED]) {
        nodes { id viewerDidAuthor commit { oid } state author { login } body bodyHTML submittedAt }
      }
      stackEntry {
        position
        stack {
          size
          entries(first: 100) {
            nodes { position pullRequest { number title state } }
          }
        }
      }
      reviewThreads(first: 50, after: $threads) {
        pageInfo { hasNextPage endCursor }
        nodes {
          id isResolved isOutdated path line startLine diffSide startDiffSide viewerCanResolve viewerCanUnresolve
          comments(first: 100) {
            nodes {
              id author { login } body bodyHTML createdAt state viewerDidAuthor viewerCanUpdate viewerCanDelete
              reactionGroups { ...reactions }
            }
          }
        }
      }
      comments(last: 100) {
        nodes {
          id author { login } body bodyHTML createdAt viewerDidAuthor viewerCanUpdate viewerCanDelete
          reactionGroups { ...reactions }
        }
      }
      files(first: 100, after: $files) {
        pageInfo { hasNextPage endCursor }
        nodes { path viewerViewedState }
      }
    }
  }
}

fragment reactions on ReactionGroup {
  content
  viewerHasReacted
  reactors { totalCount }
}
